name: CI

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

on:
  pull_request:

jobs:
  release-scripts:
    name: Checking the release scripts

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Keep in step with cd.yaml.
          cache: npm

      - name: Fetch NPM dependencies
        run: npm ci --no-fund --legacy-peer-deps # eslint 7 vs @typescript-eslint 8; lint only, unused by CD.
        env:
          NODE_ENV: cd # Same as cd.yaml, so the dev dependencies are installed.

      - name: Compile the scripts cd.yaml runs
        run: |
          npm run build:scripts
          npm run build:workflow-scripts
          npx --no-install ts-node-script .scripts/versioninfo_t4.ts OpenSim/Framework/Servers/VersionInfo.tt
          git checkout -- OpenSim/Framework/Servers/VersionInfo.tt

      - name: Load the compiled release-draft script
        # cd.yaml runs it inside actions/github-script, so it must load nothing itself.
        run: node -e 'require("./.github/scripts/.build/cd/create_release_draft.js"); console.log("ok");'

  build-and-test:
    name: Building and testing

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2022
        
    steps:
      - name: Setup NuGet.exe for use with actions
        uses: NuGet/setup-nuget@v2

      - name: Add msbuild to PATH
        if: success() && runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            ${{ env.NUGET_PACKAGES }}
          key: ${{ matrix.os }}-nuget-${{ hashFiles('**/packages.config', '**/packages.lock.json') }}
          restore-keys: |
            ${{ matrix.os }}-nuget-

      - name: Prepare env vars
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            COMPILED_BY="Mono"
            EDITION="Mono"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            COMPILED_BY="VS2022"
            EDITION="dotnet"
          else
            echo "$RUNNER_OS not supported"
            exit 1
          fi

          echo "COMPILED_BY=$COMPILED_BY"; echo "COMPILED_BY=$COMPILED_BY" >> $GITHUB_ENV
          echo "EDITION=$EDITION"; echo "EDITION=$EDITION" >> $GITHUB_ENV
        shell: bash

      - name: NuGet restore
        # Before prebuild: runprebuild copies some NuGet packages into bin/.
        # if: success() && steps.cache.outputs.cache-hit != 'true' # Enabling this causes the build to fail when the cache is filled.
        run: nuget restore Halcyon.sln

      - name: Run prebuild (Linux)
        if: success() && runner.os == 'Linux'
        run: |
          ./runprebuild.sh
        shell: bash

      - name: Run prebuild (Windows)
        if: success() && runner.os == 'Windows'
        run: |
          ./runprebuild.bat
        shell: cmd

      - name: Check log4net binding redirects
        # LibreMetaverse.dll was built against log4net 2.0.8; each program's config
        # must redirect it to the version runprebuild put in bin/.
        if: success() && runner.os == 'Windows'
        run: ./scripts/check-log4net-redirects.ps1
        shell: pwsh

      - name: Build (Mono)
        if: success() && runner.os == 'Linux'
        run: msbuild /p:DefineConstants="_MONO_CLI_FLAG_" Halcyon.sln

      - name: Build (Visual Studio)
        if: success() && runner.os == 'Windows'
        run: msbuild Halcyon.sln

      - name: Install test runner
        run: |
          mkdir -p nunit
          cd nunit
          nuget install NUnit.Console -Version 3.12.0
        shell: bash

      - name: Run tests
        run: |
          ./nunit/NUnit.ConsoleRunner*/tools/nunit3-console.exe \
            bin/InWorldz.Data.Assets.Stratus.dll \
            bin/InWorldz.Phlox.Engine.dll \
            bin/InWorldz.Region.Data.Thoosa.dll \
            bin/OpenSim.Framework.Tests.dll \
            bin/OpenSim.Region.FrameworkTests.dll \
          ;
        shell: bash

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results_${{ matrix.os }}
          path: TestResult.xml
          retention-days: 5
